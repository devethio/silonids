<body class="app">
<header class="appbar">
  <div class="appbar-in">
    <a class="logo" href="index.html" aria-label="Back to the Silondis website">
      <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>

    <nav class="roles" aria-label="App sections">
      <a href="#shop" data-role="shop">Shop</a>

<main class="wrap" id="app"><div class="card empty">Loading…</div></main>

<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/js/store.js"></script>
